<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>English Vocabulary Trainer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand" id="brand">📚 <span id="siteTitle"></span></div>
    <select id="lang" aria-label="Translation language">
      <option value="uz">O'zbekcha</option>
      <option value="ru">Русский</option>
      <option value="en">English only</option>
    </select>
  </header>

  <nav class="tabs">
    <button data-go="home">🏠 Home</button>
    <button data-go="mistakes">❗ Mistakes</button>
    <button data-go="progress">📈 Progress</button>
    <span id="streak" class="streak"></span>
  </nav>

  <main id="app"></main>

  <script src="words.js"></script>
  <script src="app.js"></script>
</body>
</html>
